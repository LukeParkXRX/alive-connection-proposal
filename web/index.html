<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ALIVE Connection - BLE 기반 제로입력 관계 지능 플랫폼 대시보드" />
    <title>ALIVE Dashboard</title>
  </head>
  <body>
    <script>
      // 다크모드 깜빡임 방지 (FOUC prevention)
      (function(){
        var stored = localStorage.getItem('alive-dark-mode');
        var isDark = stored !== null ? stored === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
